<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        TG MODEL SHOP
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/index.css') }}"
    >

</head>


<body>


<div class="container">


    <!-- =================================================
         TIÊU ĐỀ
         ================================================= -->

    <div class="shop-title">

        <h1>
            TG MODEL SHOP HẢI PHÒNG
        </h1>

        <p>
            Model Kit & Metal Build
        </p>

    </div>


    <!-- =================================================
         ĐƠN CHỜ THANH TOÁN
         ================================================= -->

    {% include "components/pending_order.html" %}


    <!-- =================================================
         DANH SÁCH SẢN PHẨM
         ================================================= -->

    <div class="product-grid">


        {% for product in products %}

            {% include "components/product_card.html" %}


        {% else %}

            <div class="empty-products">

                Hiện chưa có sản phẩm.

            </div>

        {% endfor %}


    </div>


</div>


</body>

</html>
