<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>TG Model Shop</title>

    <link rel="stylesheet"
          href="{{ url_for('static',
          filename='css/style.css') }}">
</head>


<body>

<h1>TG MODEL SHOP</h1>


{% for product in products %}

<div class="card shadow p-4 mt-4">


    <h5 class="text-secondary">
        {{ product["brand"] }}
    </h5>


    <h2>
        {{ product["name"] }}
    </h2>


    <hr>


    <p>
        <strong>💰 Giá chính thức:</strong>

        {{ "{:,}".format(product["price"]) }} đ
    </p>


    <p>
        <strong>💵 Tiền cọc:</strong>

        {{ "{:,}".format(product["deposit"]) }} đ
    </p>


    <p>
        <strong>📦 Dự kiến trả hàng:</strong>

        {{ product["eta"] }}
    </p>


    <a href="/preorder/{{ product['id'] }}"
       class="btn btn-success btn-lg">

        ĐẶT PRE-ORDER

    </a>


</div>


{% endfor %}


</body>
</html>
