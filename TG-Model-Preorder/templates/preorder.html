
<!-- =====================================================
     KIỂM TRA ĐƠN CHƯA THANH TOÁN
     ===================================================== -->

<div
    id="pending-order-box"
    style="
        display:none;
        background:#fff3cd;
        border:1px solid #ffc107;
        border-radius:10px;
        padding:20px;
        margin-bottom:25px;
    "
>

    <h3 style="margin-top:0; color:#856404;">
        🔔 Bạn đang có đơn hàng chưa thanh toán
    </h3>

    <p>
        Mã đơn:
        <strong id="pending-order-code"></strong>
    </p>

    <p>
        Thời gian còn lại:
        <strong
            id="pending-order-countdown"
            style="color:#dc3545;"
        >
            Đang kiểm tra...
        </strong>
    </p>

    <button
        type="button"
        id="continue-payment-button"
        style="
            background:#198754;
            color:white;
            border:none;
            padding:10px 18px;
            border-radius:6px;
            cursor:pointer;
            font-weight:bold;
        "
    >
        💳 Tiếp tục thanh toán
    </button>

    <a
        href="/"
        style="
            display:inline-block;
            margin-left:10px;
            padding:10px 18px;
        "
    >
        Quay lại trang chủ
    </a>

</div>


<!-- =====================================================
     FORM ĐẶT PRE-ORDER
     ===================================================== -->

<form
    action="/submit"
    method="POST"
    id="preorder-form"
>


    <!-- ID sản phẩm -->

    <input
        type="hidden"
        name="product_id"
        value="{{ product.id }}"
    >


    <label>
        Họ và tên
    </label>

    <br>

    <input
        type="text"
        name="fullname"
        required
    >

    <br><br>


    <label>
        Số điện thoại
    </label>

    <br>

    <input
        type="text"
        name="phone"
        required
    >

    <br><br>


    <label>
        Facebook hoặc Zalo
    </label>

    <br>

    <input
        type="text"
        name="contact"
    >

    <br><br>


    <label>
        Số lượng
    </label>

    <br>

    <input
        type="number"
        name="quantity"
        value="1"
        min="1"
    >

    <br><br>


    <label>
        Tỉnh / Thành phố
    </label>

    <br>

    <select
        id="province"
        name="province"
        required
    >

        <option value="">
            -- Chọn tỉnh --
        </option>

    </select>

    <br><br>


    <label>
        Quận / Huyện
    </label>

    <br>

    <select
        id="district"
        name="district"
        disabled
        required
    >

        <option value="">
            -- Chọn quận / huyện --
        </option>

    </select>

    <br><br>


    <label>
        Phường / Xã
    </label>

    <br>

    <select
        id="ward"
        name="ward"
        disabled
        required
    >

        <option value="">
            -- Chọn phường / xã --
        </option>

    </select>

    <br><br>


    <label>
        Địa chỉ chi tiết
    </label>

    <br>

    <input
        type="text"
        name="address_detail"
        placeholder="Ví dụ: Số 123 Nguyễn Trãi"
        required
    >

    <br><br>


    <label>
        Ghi chú
    </label>

    <br>

    <textarea
        name="note"
        placeholder="Ghi chú thêm (nếu có)"
    ></textarea>

    <br><br>


    <button
        type="submit"
        id="submit-order-button"
    >
        Gửi đơn
    </button>


</form>


<!-- =====================================================
     JAVASCRIPT
     ===================================================== -->

<script>

let pendingOrderTimer = null;


// =========================================================
// KIỂM TRA ĐƠN CŨ
// =========================================================

async function checkPendingOrder() {

    try {

        const response = await fetch(
            "/api/pending-order",
            {
                method: "GET",
                credentials: "same-origin"
            }
        );


        if (!response.ok) {

            return;
        }


        const data =
            await response.json();


        const box =
            document.getElementById(
                "pending-order-box"
            );


        const form =
            document.getElementById(
                "preorder-form"
            );


        const submitButton =
            document.getElementById(
                "submit-order-button"
            );


        const orderCode =
            document.getElementById(
                "pending-order-code"
            );


        const countdown =
            document.getElementById(
                "pending-order-countdown"
            );


        const paymentButton =
            document.getElementById(
                "continue-payment-button"
            );


        // =================================================
        // KHÔNG CÓ ĐƠN CŨ
        // =================================================

        if (!data.has_order) {

            box.style.display = "none";

            form.style.display = "block";

            return;
        }


        // =================================================
        // CÓ ĐƠN CŨ
        // =================================================

        box.style.display = "block";


        orderCode.textContent =
            data.order_code;


        // Không cho tạo đơn mới

        submitButton.disabled = true;


        submitButton.style.background =
            "#999";


        submitButton.style.cursor =
            "not-allowed";


        // =================================================
        // NÚT TIẾP TỤC THANH TOÁN
        // =================================================

        paymentButton.onclick =
            function() {

                window.location.href =
                    data.payment_url;

            };


        // =================================================
        // TÍNH THỜI GIAN
        // =================================================

        const expiresAt =
            new Date(
                data.expires_at
            ).getTime();


        if (pendingOrderTimer) {

            clearInterval(
                pendingOrderTimer
            );
        }


        function updateCountdown() {

            const remaining =
                expiresAt - Date.now();


            // =============================================
            // HẾT HẠN
            // =============================================

            if (remaining <= 0) {

                clearInterval(
                    pendingOrderTimer
                );


                countdown.textContent =
                    "ĐÃ HẾT HẠN";


                paymentButton.style.display =
                    "none";


                box.style.background =
                    "#f8d7da";


                box.style.borderColor =
                    "#dc3545";


                // Cho phép tạo đơn mới

                submitButton.disabled =
                    false;


                submitButton.style.background =
                    "";


                submitButton.style.cursor =
                    "pointer";


                return;
            }


            // =============================================
            // PHÚT
            // =============================================

            const minutes =
                Math.floor(
                    remaining / 60000
                );


            // =============================================
            // GIÂY
            // =============================================

            const seconds =
                Math.floor(
                    (remaining % 60000) / 1000
                );


            countdown.textContent =
                minutes +
                " phút " +
                String(seconds).padStart(
                    2,
                    "0"
                ) +
                " giây";
        }


        updateCountdown();


        pendingOrderTimer =
            setInterval(
                updateCountdown,
                1000
            );


    }
    catch (error) {

        console.error(
            "Lỗi kiểm tra đơn hàng:",
            error
        );

    }

}


// =========================================================
// CHẠY KHI TRANG LOAD
// =========================================================

document.addEventListener(
    "DOMContentLoaded",
    function() {

        checkPendingOrder();

    }
);

</script>
