<!DOCTYPE html>

<html lang="vi">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Đặt Pre-order</title>


<style>

    body {

        font-family: Arial, sans-serif;

        max-width: 800px;

        margin: 40px auto;

        padding: 20px;
    }


    input,
    select,
    textarea {

        width: 100%;

        max-width: 500px;

        padding: 10px;

        margin-top: 5px;

        box-sizing: border-box;
    }


    textarea {

        min-height: 100px;
    }


    button {

        padding: 10px 20px;

        cursor: pointer;
    }


    /* =================================================
       THÔNG TIN SẢN PHẨM
       ================================================= */

    .product-box {

        border: 1px solid #ddd;

        border-radius: 10px;

        padding: 20px;

        margin-bottom: 30px;

        background: #f8f9fa;
    }


    .product-brand {

        color: #6c757d;

        margin-bottom: 5px;
    }


    .product-name {

        margin-top: 5px;
    }


    /* =================================================
       NÚT GỬI ĐƠN
       ================================================= */

    .submit-button {

        background: #198754;

        color: white;

        border: none;

        border-radius: 6px;

        font-weight: bold;

        padding: 10px 20px;
    }


    .submit-button:hover {

        background: #157347;
    }


    /* =================================================
       QUAY LẠI
       ================================================= */

    .back-link {

        display: inline-block;

        margin-top: 20px;

        color: #0d6efd;

        text-decoration: none;
    }


    .back-link:hover {

        text-decoration: underline;
    }

</style>

</head>

<body>

<!-- =====================================================
     THÔNG TIN SẢN PHẨM
     ===================================================== -->

<div class="product-box">
<div class="product-brand">

    {{ product.brand }}

</div>


<h2 class="product-name">

    {{ product.name }}

</h2>


<hr>


<p>

    <strong>
        💰 Giá chính thức:
    </strong>

    {{ "{:,}".format(product.price) }} đ

</p>


<p>

    <strong>
        💵 Tiền cọc:
    </strong>

    {{ "{:,}".format(product.deposit) }} đ

</p>


<p>

    <strong>
        📦 Dự kiến trả hàng:
    </strong>

    {{ product.eta }}

</p>

</div>

<!-- =====================================================
     FORM ĐẶT HÀNG
     ===================================================== -->

<form
    action="/submit"
    method="POST"
    id="preorder-form"
>

<!-- =================================================
     ID SẢN PHẨM
     ================================================= -->

<input
    type="hidden"
    name="product_id"
    value="{{ product.id }}"
>



<!-- =================================================
     HỌ TÊN
     ================================================= -->

<label>
    Họ và tên
</label>

<br>

<input
    type="text"
    name="fullname"
    required
>

<br><br>



<!-- =================================================
     SỐ ĐIỆN THOẠI
     ================================================= -->

<label>
    Số điện thoại
</label>

<br>

<input
    type="text"
    name="phone"
    required
>

<br><br>



<!-- =================================================
     FACEBOOK / ZALO
     ================================================= -->

<label>
    Facebook hoặc Zalo
</label>

<br>

<input
    type="text"
    name="contact"
>

<br><br>



<!-- =================================================
     SỐ LƯỢNG
     ================================================= -->

<label>
    Số lượng
</label>

<br>

<input
    type="number"
    name="quantity"
    value="1"
    min="1"
>

<br><br>



<!-- =================================================
     TỈNH / THÀNH PHỐ
     ================================================= -->

<label>
    Tỉnh / Thành phố
</label>

<br>

<select
    id="province"
    name="province"
    required
>

    <option value="">
        -- Chọn tỉnh --
    </option>

</select>

<br><br>



<!-- =================================================
     QUẬN / HUYỆN
     ================================================= -->

<label>
    Quận / Huyện
</label>

<br>

<select
    id="district"
    name="district"
    disabled
    required
>

    <option value="">
        -- Chọn quận / huyện --
    </option>

</select>

<br><br>



<!-- =================================================
     PHƯỜNG / XÃ
     ================================================= -->

<label>
    Phường / Xã
</label>

<br>

<select
    id="ward"
    name="ward"
    disabled
    required
>

    <option value="">
        -- Chọn phường / xã --
    </option>

</select>

<br><br>



<!-- =================================================
     ĐỊA CHỈ CHI TIẾT
     ================================================= -->

<label>
    Địa chỉ chi tiết
</label>

<br>

<input
    type="text"
    name="address_detail"
    placeholder="Ví dụ: Số 123 Nguyễn Trãi"
    required
>

<br><br>



<!-- =================================================
     GHI CHÚ
     ================================================= -->

<label>
    Ghi chú
</label>

<br>

<textarea
    name="note"
    placeholder="Ghi chú thêm (nếu có)"
></textarea>

<br><br>



<!-- =================================================
     GỬI ĐƠN
     ================================================= -->

<button
    type="submit"
    id="submit-order-button"
    class="submit-button"
>

    Gửi đơn

</button>

</form>

<a
href="/"
class="back-link"

>
← Quay lại trang chủ

</a>

<!-- =====================================================
     JAVASCRIPT TỈNH / HUYỆN / XÃ
     ===================================================== -->

<script>


const provinceSelect =
    document.getElementById(
        "province"
    );


const districtSelect =
    document.getElementById(
        "district"
    );


const wardSelect =
    document.getElementById(
        "ward"
    );



// =========================================================
// TẢI TỈNH / THÀNH PHỐ
// =========================================================

fetch(
    "https://provinces.open-api.vn/api/v1/p/"
)

.then(
    response => response.json()
)

.then(
    provinces => {

        provinces.forEach(
            province => {

                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    province.name;


                option.textContent =
                    province.name;


                option.dataset.id =
                    province.code;


                provinceSelect.appendChild(
                    option
                );

            }
        );

    }
)

.catch(
    error => {

        console.error(
            "Không tải được danh sách tỉnh:",
            error
        );

    }
);



// =========================================================
// CHỌN TỈNH → TẢI QUẬN / HUYỆN
// =========================================================

provinceSelect.addEventListener(
    "change",
    function() {


        const selected =
            this.options[
                this.selectedIndex
            ];


        const provinceId =
            selected.dataset.id;


        districtSelect.innerHTML =
            `
            <option value="">
                -- Chọn quận / huyện --
            </option>
            `;


        wardSelect.innerHTML =
            `
            <option value="">
                -- Chọn phường / xã --
            </option>
            `;


        wardSelect.disabled =
            true;


        if (!provinceId) {

            districtSelect.disabled =
                true;

            return;
        }


        districtSelect.disabled =
            false;


        fetch(
            "https://provinces.open-api.vn/api/v1/p/"
            + provinceId
            + "?depth=2"
        )

        .then(
            response => response.json()
        )

        .then(
            data => {

                data.districts.forEach(
                    district => {

                        const option =
                            document.createElement(
                                "option"
                            );


                        option.value =
                            district.name;


                        option.textContent =
                            district.name;


                        option.dataset.id =
                            district.code;


                        districtSelect.appendChild(
                            option
                        );

                    }
                );

            }
        )

        .catch(
            error => {

                console.error(
                    "Không tải được quận/huyện:",
                    error
                );

            }
        );

    }
);



// =========================================================
// CHỌN QUẬN → TẢI PHƯỜNG / XÃ
// =========================================================

districtSelect.addEventListener(
    "change",
    function() {


        const selected =
            this.options[
                this.selectedIndex
            ];


        const districtId =
            selected.dataset.id;


        wardSelect.innerHTML =
            `
            <option value="">
                -- Chọn phường / xã --
            </option>
            `;


        if (!districtId) {

            wardSelect.disabled =
                true;

            return;
        }


        wardSelect.disabled =
            false;


        fetch(
            "https://provinces.open-api.vn/api/v1/d/"
            + districtId
            + "?depth=2"
        )

        .then(
            response => response.json()
        )

        .then(
            data => {

                data.wards.forEach(
                    ward => {

                        const option =
                            document.createElement(
                                "option"
                            );


                        option.value =
                            ward.name;


                        option.textContent =
                            ward.name;


                        wardSelect.appendChild(
                            option
                        );

                    }
                );

            }
        )

        .catch(
            error => {

                console.error(
                    "Không tải được phường/xã:",
                    error
                );

            }
        );

    }
);


</script>

</body>

</html>
