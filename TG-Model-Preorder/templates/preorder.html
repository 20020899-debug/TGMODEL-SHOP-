<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <title>Đặt Pre-order</title>

</head>

<body>

<h2>Đặt Pre-order</h2>

<form>

    <p>

        Họ và tên

    </p>

    <input type="text">

    <br><br>

    <p>

        Số điện thoại

    </p>

    <input type="text">

    <br><br>

    <p>

        Facebook hoặc Zalo

    </p>

    <input type="text">

    <br><br>

    <p>

        Số lượng

    </p>

    <input type="number" value="1">

    <br><br>
    <label>Tỉnh / Thành phố</label>
<select id="province">
    <option value="">-- Chọn tỉnh --</option>
</select>

<br><br>

<label>Quận / Huyện</label>
<select id="district" disabled>
    <option value="">-- Chọn quận / huyện --</option>
</select>

<br><br>

<label>Phường / Xã</label>
<select id="ward" disabled>
    <option value="">-- Chọn phường / xã --</option>
</select>

<label>Địa chỉ chi tiết</label>
<input
    type="text"
    id="address_detail"
    name="address_detail"
    class="form-control"
    placeholder="Ví dụ: 123 Nguyễn Trãi">

       <button>

        Gửi đơn

    </button>

</form>

<script src="{{ url_for('static', filename='js/address.js') }}"></script>

</body>

</html>
